
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | FINTRACK</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

<div class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-brand">

      <span class="brand-icon">
        <i class="fa-solid fa-compass"></i>
      </span>

      <h2>FINTRACK</h2>

      <p class="text-muted">Track. Plan. Grow.</p>

      <p class="text-muted">Create your account and start managing your finances.</p>

    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'danger' else category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register_page') }}">

      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input
          type="text"
          name="name"
          class="form-control"
          placeholder="Your name"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          class="form-control"
          placeholder="At least 6 characters"
          required
          minlength="6"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input
          type="password"
          name="confirm_password"
          class="form-control"
          placeholder="Re-enter password"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Create Account
      </button>

    </form>

    <p class="text-center mt-3 mb-0">
      Already have an account?
      <a href="{{ url_for('auth.login_page') }}">Login here</a>
    </p>

  </div>

</div>

</body>
</html>
